<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskesy Admin Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .tab-btn.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800" id="mainBody">

    <!-- Login Screen -->
    <div id="loginScreen" class="flex items-center justify-center h-screen transition-all">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-96 text-center">
            <span class="text-6xl mb-4 block">👑</span>
            <h2 class="text-2xl font-bold mb-6">Admin Panel</h2>
            <input type="password" id="adminPassword" placeholder="Enter Password" class="w-full p-3 border rounded-lg mb-4 text-center tracking-widest focus:ring-2 focus:ring-blue-500 outline-none">
            <button onclick="checkPassword()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow">Login</button>
            <p id="errorMsg" class="text-red-500 mt-4 hidden font-semibold">❌ Invalid Password!</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboardScreen" class="hidden flex flex-col md:flex-row min-h-screen">
        
        <!-- Sidebar -->
        <div class="w-full md:w-64 bg-gray-900 text-white shadow-lg p-6">
            <h2 class="text-2xl font-bold mb-8 flex items-center gap-2">👑 Taskesy</h2>
            <nav class="space-y-4">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="tab-btn w-full text-left py-2 px-4 rounded hover:bg-gray-800 transition active bg-gray-800">📊 Dashboard (Live)</button>
                <button onclick="switchTab('history')" id="nav-history" class="tab-btn w-full text-left py-2 px-4 rounded hover:bg-gray-800 transition">📂 History Tasks</button>
                <button onclick="switchTab('report')" id="nav-report" class="tab-btn w-full text-left py-2 px-4 rounded hover:bg-gray-800 transition">⚙️ Report Manage</button>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-8 overflow-x-hidden">
            
            <!-- Dashboard Tab -->
            <div id="tab-dashboard">
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <h1 class="text-3xl font-bold">Live Tasks</h1>
                    <select id="taskSelect" onchange="loadSubmissions(false)" class="p-2 border rounded-lg shadow-sm focus:ring focus:ring-blue-200 outline-none bg-white font-semibold">
                        <option value="">Select a Task...</option>
                    </select>
                </div>
                
                <div class="flex gap-4 mb-4" id="dashboardActions" style="display: none;">
                    <button onclick="exportToCSV(false)" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 shadow font-semibold">📥 Download Sheet (CSV)</button>
                    <button onclick="completeToday()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 shadow font-semibold">✅ Complete Today</button>
                </div>

                <div class="bg-white rounded-lg shadow overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-gray-100"><th class="p-3 border">Task ID</th><th class="p-3 border">UID/Username</th><th class="p-3 border">Password</th><th class="p-3 border">2FA</th><th class="p-3 border">Cookies</th><th class="p-3 border">Date</th></tr></thead>
                        <tbody id="tableBodyLive"><tr><td colspan="6" class="p-4 text-center text-gray-500">Please select a task to view data.</td></tr></tbody>
                    </table>
                </div>
            </div>

            <!-- History Tab -->
            <div id="tab-history" class="hidden">
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <h1 class="text-3xl font-bold">History Tasks</h1>
                    <select id="historyTaskSelect" onchange="loadSubmissions(true)" class="p-2 border rounded-lg shadow-sm focus:ring focus:ring-blue-200 outline-none bg-white font-semibold">
                        <option value="">Select a Task...</option>
                    </select>
                </div>
                
                <div class="flex gap-4 mb-4" id="historyActions" style="display: none;">
                    <button onclick="exportToCSV(true)" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 shadow font-semibold">📥 Download History</button>
                    <button onclick="deleteAllHistory()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 shadow font-semibold">🗑️ Delete All History</button>
                </div>

                <div class="bg-white rounded-lg shadow overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-gray-100"><th class="p-3 border">Task ID</th><th class="p-3 border">UID/Username</th><th class="p-3 border">Password</th><th class="p-3 border">2FA</th><th class="p-3 border">Cookies</th><th class="p-3 border">Date</th></tr></thead>
                        <tbody id="tableBodyHistory"><tr><td colspan="6" class="p-4 text-center text-gray-500">Please select a task to view history.</td></tr></tbody>
                    </table>
                </div>
            </div>

            <!-- Report Manage Tab -->
            <div id="tab-report" class="hidden">
                <h1 class="text-3xl font-bold mb-6 border-b pb-4">Bulk Report Manage</h1>
                <div class="bg-white p-6 rounded-lg shadow max-w-3xl">
                    <label class="block font-semibold mb-2 text-gray-700">Paste Task IDs (Comma or newline separated):</label>
                    <textarea id="bulkTaskIds" rows="8" class="w-full p-4 border rounded-lg mb-4 focus:ring focus:ring-blue-200 outline-none font-mono" placeholder="WP-12345&#10;WP-67890"></textarea>
                    
                    <div class="flex gap-4">
                        <button onclick="processBulkAction('approved')" class="flex-1 bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 shadow">✅ Approve All</button>
                        <button onclick="processBulkAction('rejected')" class="flex-1 bg-red-500 text-white font-bold py-3 rounded-lg hover:bg-red-600 shadow">❌ Reject All</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = "https://mamuntaskbot.onrender.com"; 
        const ADMIN_PASS = "Admin#micro24@#";
        
        let globalTasks = [];
        let currentSubmissions = [];
        let currentTaskType = '';

        document.getElementById("adminPassword").addEventListener("keypress", e => { if (e.key === "Enter") checkPassword(); });

        function checkPassword() {
            if(document.getElementById('adminPassword').value === ADMIN_PASS) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
                fetchAllTasks();
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        function switchTab(tabId) {
            ['dashboard', 'history', 'report'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('bg-gray-800', 'border-l-4', 'border-blue-500');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.add('bg-gray-800', 'border-l-4', 'border-blue-500');
        }

        async function fetchAllTasks() {
            try {
                const res = await fetch(`${API_URL}/api/tasks`);
                globalTasks = await res.json();
                
                const selectLive = document.getElementById('taskSelect');
                const selectHistory = document.getElementById('historyTaskSelect');
                selectLive.innerHTML = '<option value="">Select a Task...</option>';
                selectHistory.innerHTML = '<option value="">Select a Task...</option>';

                globalTasks.forEach(t => {
                    const opt = `<option value="${t._id}" data-type="${t.type}">${t.name} (৳${t.price})</option>`;
                    selectLive.innerHTML += opt;
                    selectHistory.innerHTML += opt;
                });
            } catch(e) { alert("Error connecting to server!"); }
        }

        async function loadSubmissions(isHistory) {
            const selectId = isHistory ? 'historyTaskSelect' : 'taskSelect';
            const tbodyId = isHistory ? 'tableBodyHistory' : 'tableBodyLive';
            const actionDivId = isHistory ? 'historyActions' : 'dashboardActions';
            
            const select = document.getElementById(selectId);
            const taskId = select.value;
            currentTaskType = select.options[select.selectedIndex]?.getAttribute('data-type') || '';
            const tbody = document.getElementById(tbodyId);

            if(!taskId) {
                document.getElementById(actionDivId).style.display = 'none';
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-500">Please select a task.</td></tr>';
                return;
            }

            tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center">Loading data...</td></tr>';
            try {
                const res = await fetch(`${API_URL}/api/submissions/${taskId}?history=${isHistory}`);
                currentSubmissions = await res.json();
                
                if(currentSubmissions.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500 font-bold">No ${isHistory ? 'History' : 'Pending'} tasks found!</td></tr>`;
                    document.getElementById(actionDivId).style.display = 'none';
                    return;
                }

                document.getElementById(actionDivId).style.display = 'flex';
                tbody.innerHTML = '';
                currentSubmissions.forEach(task => {
                    const isFB = ['fb', 'facebook'].includes(currentTaskType.toLowerCase());
                    const col1 = isFB ? (task.fbUid || 'N/A') : (task.username || task.generatedEmail || 'N/A');
                    const cookieShort = task.cookie ? (task.cookie.length > 20 ? task.cookie.substring(0,20)+'...' : task.cookie) : 'N/A';
                    
                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-blue-50">
                            <td class="p-3 border font-mono text-sm font-bold">${task.taskId}</td>
                            <td class="p-3 border font-mono">${col1}</td>
                            <td class="p-3 border font-mono text-red-600">${task.password || 'N/A'}</td>
                            <td class="p-3 border font-mono text-blue-600">${task.secret2fa || 'N/A'}</td>
                            <td class="p-3 border text-xs" title="${task.cookie||''}">${cookieShort}</td>
                            <td class="p-3 border text-xs">${new Date(task.time).toLocaleDateString('en-GB')}</td>
                        </tr>
                    `;
                });
            } catch(e) { tbody.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-red-500">Error loading data.</td></tr>'; }
        }

        async function completeToday() {
            const taskId = document.getElementById('taskSelect').value;
            if(!taskId || !confirm("Move all these live tasks to History?")) return;
            
            try {
                const res = await fetch(`${API_URL}/api/moveToHistory`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ taskId })
                });
                if((await res.json()).success) { alert("Successfully moved to history!"); loadSubmissions(false); }
                else alert("Error moving to history.");
            } catch(e) { alert("Request failed!"); }
        }

        async function deleteAllHistory() {
            if(!confirm("Are you sure you want to DELETE ALL history data forever?")) return;
            try {
                const res = await fetch(`${API_URL}/api/deleteHistory`, { method: 'POST' });
                if((await res.json()).success) { alert("History deleted!"); loadSubmissions(true); }
                else alert("Error deleting history.");
            } catch(e) { alert("Request failed!"); }
        }

        async function processBulkAction(action) {
            const idsRaw = document.getElementById('bulkTaskIds').value;
            const taskIds = idsRaw.split(/[\n,]+/).map(id => id.trim()).filter(id => id);
            
            if(taskIds.length === 0) return alert("Please paste some Task IDs first!");
            if(!confirm(`Are you sure you want to ${action.toUpperCase()} ${taskIds.length} tasks?`)) return;

            try {
                const res = await fetch(`${API_URL}/api/bulkAction`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taskIds, action })
                });
                const result = await res.json();
                if(result.success) {
                    alert(`Successfully processed ${result.processedCount} tasks!`);
                    document.getElementById('bulkTaskIds').value = '';
                } else alert("Error: " + result.message);
            } catch(e) { alert("Request failed!"); }
        }

        function exportToCSV(isHistory) {
            if(currentSubmissions.length === 0) return alert("No data to export!");
            const isFB = ['fb', 'facebook'].includes(currentTaskType.toLowerCase());
            
            let header = isFB ? "UID,Password,2FA,Cookies,Task ID\n" : "Username,Password,2FA,Cookies,Task ID\n";
            let csv = header;

            currentSubmissions.forEach(t => {
                let col1 = isFB ? (t.fbUid || 'N/A') : (t.username || t.generatedEmail || 'N/A');
                csv += `"${col1}","${t.password || 'N/A'}","${t.secret2fa || 'N/A'}","${t.cookie || 'N/A'}","${t.taskId}"\n`;
            });

            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${isHistory ? 'History' : 'Live'}_Tasks.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
